<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדרש תמונה – רגע של עברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6edd8; --ink:#2c2a20; --muted:#5d5a48; --card:#fffdf4; --line:#cdd5bb;
  --shell:#a8631a; --shell-soft:#f3dfbd; --stalk:#7c7787; --eye:#fffdf4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b2217; --ink:#f1edda; --muted:#bdb9a3; --card:#27301f; --line:#3d4a33;
  --shell:#e3a24d; --shell-soft:#4a3a1f; --stalk:#a9a4b4; --eye:#1b2217;}}
:root[data-theme="dark"]{
  --bg:#1b2217; --ink:#f1edda; --muted:#bdb9a3; --card:#27301f; --line:#3d4a33;
  --shell:#e3a24d; --shell-soft:#4a3a1f; --stalk:#a9a4b4; --eye:#1b2217;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Arial Hebrew",Arial,sans-serif;font-size:18px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ant{position:absolute;width:70px;height:300px;opacity:.38;transform-origin:50% 100%;animation:sway var(--d,5s) ease-in-out var(--l,0s) infinite alternate}
.ant.top{transform-origin:50% 0}
.ant.top svg{transform:scaleY(-1)}
.ant svg{width:100%;height:100%;overflow:visible}
@keyframes sway{from{rotate:calc(var(--r,8deg)*-1)}to{rotate:var(--r,8deg)}}
.eyeball{animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 18px 56px}
h1{font-family:"Suez One",Heebo,serif;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.1;margin:0;color:var(--shell)}
.sub{font-size:20px;color:var(--muted);margin:6px 0 22px}
figure{margin:0 0 22px;background:var(--card);border-radius:22px;padding:10px 10px 8px;border:2px solid var(--line)}
figure img{display:block;width:100%;height:auto;border-radius:14px;max-height:70vh;object-fit:cover}
figcaption{text-align:center;font-size:15px;color:var(--muted);padding-top:8px}
.q{font-family:"Suez One",Heebo,serif;font-size:clamp(22px,5vw,28px);line-height:1.3;margin:0 0 4px}
.hint{color:var(--muted);font-size:16px;margin:0 0 14px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:11px 16px;font-size:20px;font-weight:500;transition:transform .15s,border-color .15s,background .15s}
.opt:hover{border-color:var(--shell);transform:translateX(-4px)}
.opt:focus-visible{outline:3px solid var(--shell);outline-offset:3px}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--shell-soft);color:var(--shell);display:grid;place-items:center;font-weight:700;font-size:18px}
.opt[aria-pressed="true"]{background:var(--shell);color:var(--card);border-color:var(--shell)}
.opt[aria-pressed="true"] .l{background:var(--card);color:var(--shell)}
.opt.seen:not([aria-pressed="true"]) .l::after{content:"";}
.opt.seen:not([aria-pressed="true"]){border-style:dashed}
.tag{margin-inline-start:auto;font-size:13px;font-weight:500;background:var(--shell-soft);color:var(--shell);padding:2px 10px;border-radius:999px;white-space:nowrap}
.opt[aria-pressed="true"] .tag{background:var(--card);color:var(--shell)}
#result{margin-top:22px;scroll-margin-top:16px}
.res{background:var(--card);border:2px solid var(--shell);border-radius:22px;padding:20px 20px 16px;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.res h2{font-family:"Suez One",Heebo,serif;font-weight:400;font-size:30px;margin:0 0 6px;color:var(--shell)}
.res p{margin:0 0 10px}
.res b{color:var(--shell)}
.res .ex{background:var(--shell-soft);border-radius:12px;padding:8px 12px;font-size:17px}
.prog{margin-top:22px;color:var(--muted);font-size:16px;text-align:center}
.fact{margin-top:26px;font-size:16px;color:var(--muted);border-top:2px dotted var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){.ant,.eyeball,.res{animation:none}.opt{transition:none}}
</style>
</head>

{l:'א',t:'עין תחת עין',m:'עונש או תגמול השווים בדיוק לעוולה שנעשתה: מידה כנגד מידה.',o:'מקורו בתורה (שמות כ״א 24). חז״ל פירשו שהכוונה לפיצוי כספי ולא לנקמה פיזית.',p:'שני החלזונות עומדים זה מול זה, עין מול עין. אבל נראה שאף אחד לא מתכנן נקמה, הם פשוט מתעניינים.',e:'״הוא איחר לי לפגישה, אז איחרתי לו בחזרה. עין תחת עין.״'},
{l:'ב',t:'שם עליך עין',m:'ביטוי דו-משמעי: או שמישהו חושק במה שיש לך, או שהוא מעקב אחריך ומשגיח עליך. ההקשר קובע.',o:'״לשים עין על״ משמש בעברית המדוברת גם לחשק (״שמתי עין על האופניים האלה״) וגם לשמירה (״תשים עין על התיק״).',p:'החלזון שבחלק העליון של הענף מציץ מטה אל חברו. האם הוא שומר עליו, או שחשק בעלה שלו?',e:'״מישהו שם עין על הדירה ליד הפארק.״'},
{l:'ג',t:'רואים עין בעין',m:'מסכימים לגמרי, רואים את הדברים בדיוק באותו אופן.',o:'מקורו בישעיהו נ״ב 8, שם הכוונה לראייה ישירה ובהירה. בעברית של ימינו הביטוי הפך להסכמה מלאה.',p:'שני החלזונות מביטים זה בזה בגובה העיניים. אין ויכוח, יש הבנה.',e:'״אני והמנהלת רואים עין בעין את הנושא.״'},
{l:'ד',t:'חותרים למגע',m:'לפעול ביוזמה כדי ליצור קשר או מגע, בלי לחכות שיבוא לבד.',o:'מונח צבאי (״חתירה למגע״) שמתאר התקדמות אל האויב כדי להיפגש איתו. היום משתמשים בו גם בעבודה, בספורט ובחיי היום-יום.',p:'המחושים מושטים קדימה ומגששים. החלזון התחתון אכן מתקדם בנחישות אל פגישה.',e:'״הקבוצה חתרה למגע מהדקה הראשונה.״'},
{l:'ה',t:'השגחה צמודה',m:'מעקב רציף ומתמיד אחרי אדם או מצב, כדי שלא יקרה משהו רע.',o:'מונח מעולם הבריאות והחינוך: חולה או ילד ״על השגחה צמודה״ לא נשארים לבד לרגע.',p:'החלזון העליון נראה כמו מבקר שמשקיף מלמעלה ולא מוריד עין מהחלזון שמתחתיו.',e:'״אחרי הניתוח הוא נשאר בהשגחה צמודה.״'},
{l:'ו',t:'פנים אל פנים',m:'מפגש ישיר, בלי מתווכים ובלי מחיצה.',o:'מקורו בסיפור יעקב (בראשית ל״ב 31) ובתיאור משה (דברים ל״ד 10). מאז הוא משמש לכל מפגש אישי ומיידי.',p:'הנה שני החלזונות, ראש מול ראש, בלי שום דבר ביניהם. בדיוק כמו בביטוי.',e:'״סוף סוף נפגשנו פנים אל פנים.״',c:1},
{l:'ז',t:'מגששים את הדרך',m:'מתקדמים בזהירות כשלא ברור מה צפוי, צעד אחר צעד.',o:'הפועל ״גישש״ קשור למישוש. הוא מופיע בישעיהו נ״ט 10 (״נגששה כעורים קיר״). חלזונות הם מגששים מקצועיים: המחושים מרגישים כל מה שבדרך.',p:'ענפים מפותלים, אבנים וכל כך הרבה מחושים. הם בטח מגששים את הדרך החוצה מהסבך.',e:'״החברה החדשה עדיין מגששת את הדרך בשוק.״',c:1},
{l:'ח',t:'אחיזת עיניים',m:'תעלול או אשליה: משהו שנראה אמיתי אבל הוא לא, כמו טריק של קוסם.',o:'ביטוי מלשון חז״ל, מהפועל ״לאחוז״: כאילו הקוסם אוחז בעיני הצופים וגורם להם לראות משהו שאינו קיים.',p:'מי שמביט מהר בתמונה עלול לחשוב שהחלזונות נוגעים זה בזה במרכז, אבל אולי זו רק אחיזת עיניים של הצילום.',e:'״הקוסם גרם לארנב להיעלם. זו אחיזת עיניים, כמובן.״'},
{l:'ט',t:'בארבע עיניים',m:'שיחה פרטית בין שני אנשים בלבד, בלי קהל.',o:'הביטוי נכנס לעברית בתרגום מגרמנית (unter vier Augen). ארבע עיניים הן של שני אנשים, שתי עיניים לכל אחד.',p:'וואו, כמעט כאילו הצילום נעשה בשביל הביטוי הזה: שני חלזונות, ועל המחושים שלהם בדיוק ארבע עיניים.',e:'״אני צריכה לדבר איתך בארבע עיניים.״'},
{l:'י',t:'למראית עין',m:'רק כלפי חוץ, כדי שזה ייראה כך, גם אם בפועל זה לא כך.',o:'שורשיו בלשון המקרא (ישעיהו י״א 3, ״ולא למראה עיניו ישפוט״), ובהלכה קיים המושג ״חשש מראית עין״ שמתייחס לדברים שנראים בעייתיים לצופה מהצד.',p:'החלזון העליון נראה כאילו הוא משגיח על חברו. אולי זה רק למראית עין, ובעצם הוא פשוט נח על הענף.',e:'״הם התחתנו למראית עין בלבד.״'}
];
var seen={},cur=-1,box=document.getElementById('opts');
DATA.forEach(function(d,i){
  var li=document.createElement('li'),b=document.createElement('button');
  b.className='opt';b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="l">'+d.l+'</span><span>'+d.t+'</span>'+(d.c?'<span class="tag">הצעה של קלוד</span>':'');
  b.onclick=function(){pick(i)};
  li.appendChild(b);box.appendChild(li);
});
function pick(i){
  var d=DATA[i];seen[i]=1;cur=i;
  var bs=box.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.setAttribute('aria-pressed',j===i?'true':'false');if(seen[j])b.classList.add('seen')});
  var r=document.getElementById('result');
  r.innerHTML='<div class="res"><h2>'+d.t+'</h2><p><b>פירוש:</b> '+d.m+'</p><p><b>מאיפה זה בא?</b> '+d.o+'</p><p><b>ומה זה קשור לתמונה?</b> '+d.p+'</p><p class="ex">'+d.e+'</p></div>';
  r.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest'});
  var n=Object.keys(seen).length;
  document.getElementById('prog').textContent=n===DATA.length?'גיליתם את כל הביטויים. כל הכבוד!':'גיליתם '+n+' מתוך '+DATA.length+' ביטויים';
}
document.getElementById('prog').textContent='גיליתם 0 מתוך '+DATA.length+' ביטויים';
(function(){
  var bg=document.getElementById('bg');
  var svg='<svg viewBox="0 0 70 300"><path d="M35 300 C35 210 22 140 38 50" fill="none" stroke="var(--stalk)" stroke-width="9" stroke-linecap="round"/><g class="eyeball" style="transform-origin:38px 36px"><circle cx="38" cy="36" r="20" fill="var(--stalk)"/><circle cx="38" cy="36" r="9" fill="var(--eye)"/><circle cx="40" cy="34" r="4" fill="var(--stalk)"/></g></svg>';
  var cfg=[
   ['bottom:-40px;left:2%',0,5,9,0,.9],['bottom:-60px;left:12%',0,6.5,7,-1.5,1.1],
   ['bottom:-50px;right:3%',0,5.5,8,-.7,1],['bottom:-70px;right:14%',0,7,10,-2,.8],
   ['bottom:-90px;left:44%',0,6,6,-3,.7],
   ['top:-60px;left:6%',1,6,8,-1,.8],['top:-70px;right:7%',1,5,9,-2.5,.9],['top:-90px;left:50%',1,7,7,-.4,.6]
  ];
  cfg.forEach(function(c){
    var a=document.createElement('div');a.className='ant'+(c[1]?' top':'');
    a.style.cssText=c[0]+';--d:'+c[2]+'s;--r:'+c[3]+'deg;--l:'+c[4]+'s;scale:'+c[5];
    a.innerHTML=svg;bg.appendChild(a);
  });
})();
</script>
</body>
</html>
